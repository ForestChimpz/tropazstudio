
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Tropaz Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080b14;
      color: #e8f0ff;
      line-height: 1.6;
    }

    header {
      padding: 22px 8%;
      border-bottom: 1px solid #20283c;
    }

    header a {
      color: #00e5ff;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 750px;
      margin: auto;
      padding: 65px 20px;
    }

    .tag {
      color: #00e5ff;
      letter-spacing: 3px;
      font-size: 13px;
    }

    h1 {
      font-size: clamp(36px, 8vw, 55px);
      margin: 12px 0;
    }

    .intro {
      color: #aab6ce;
      margin-bottom: 35px;
    }

    form {
      background: #111827;
      border: 1px solid #293653;
      border-radius: 16px;
      padding: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #34415c;
      background: #080b14;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 13px 24px;
      background: #00cfe8;
      color: #061018;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .notice {
      color: #8995ad;
      font-size: 13px;
      margin-top: 18px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #75819a;
      border-top: 1px solid #20283c;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html">TROPAZ STUDIO</a>
</header>

<main>
  <div class="tag">GET IN TOUCH</div>
  <h1>Contact Us</h1>

  <p class="intro">
    Have a project idea, business inquiry, suggestion, or question?
    Send us a message.
  </p>

  <form id="contactForm">
    <label for="name">Your Name</label>
    <input id="name" type="text" required placeholder="Enter your name">

    <label for="email">Your Email</label>
    <input id="email" type="email" required placeholder="Enter your email">

    <label for="subject">Subject</label>
    <select id="subject">
      <option>General Inquiry</option>
      <option>Game Development</option>
      <option>Collaboration</option>
      <option>Business Inquiry</option>
      <option>Technical Support</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" required placeholder="Write your message..."></textarea>

    <button type="submit">Prepare Email</button>

    <p class="notice">
      This form opens your email app with your message.
      It does not send anything automatically.
    </p>
  </form>
</main>

<footer>
  © 2026 Tropaz Studio. All rights reserved.
</footer>

<script>
  document.getElementById("contactForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const subject = document.getElementById("subject").value;
    const message = document.getElementById("message").value;

    const body =
      "Name: " + name +
      "\nEmail: " + email +
      "\n\nMessage:\n" + message;

    const mailto =
      "mailto:tropazstudio.ts@gmail.com" +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);

    window.location.href = mailto;
  });
</script>

</body>
</html>
